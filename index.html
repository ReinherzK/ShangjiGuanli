<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="客户管理">
  <meta name="format-detection" content="telephone=no">
  <title>客户管理</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="topbar-btn" id="backBtn" hidden aria-label="返回">‹ 返回</button>
    <h1 id="title">客户</h1>
    <div class="topbar-right">
      <span id="syncDot" class="sync-dot" title="同步状态"></span>
      <button class="topbar-btn" id="actionBtn" hidden></button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar">
    <a href="#/" data-tab="list"><span class="ti">👥</span><span>客户</span></a>
    <a href="#/todo" data-tab="todo"><span class="ti">⏰</span><span>待跟进</span><b id="todoBadge" class="badge" hidden></b></a>
    <a href="#/settings" data-tab="settings"><span class="ti">⚙️</span><span>设置</span></a>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
